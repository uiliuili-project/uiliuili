version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nest:
        patterns:
          - "@nestjs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      next:
        patterns:
          - next
          - "@next/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
