name: ${COMPOSE_PROJECT_NAME:-uiliuili}

x-app-environment: &app-environment
  NODE_ENV: production
  UILIUILI_ROOT: /data
  DOTENV_CONFIG_PATH: /data/.env
  APP_URL: ${APP_URL:-http://localhost:8080}
  DATABASE_URL: postgres://${DB_USER:-uiliuili}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-uiliuili}
  DB_SCHEMA: ${DB_SCHEMA:-uiliuili}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  STORAGE_ROOT: /data/storage/uploads
  WORKER_TEMP_ROOT: /data/storage/tmp
  FFMPEG_PATH: ffmpeg
  FFPROBE_PATH: ffprobe
  TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-2}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: "true"
  API_INTERNAL_URL: http://api:3001

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-uiliuili}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-uiliuili}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uiliuili} -d ${DB_NAME:-uiliuili}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The video node keeps its own database; it is never shared with the site.
  node-postgres:
    image: postgres:16-alpine
    profiles: ["video-node"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VIDEO_NODE_DB_USER:-video_node}
      POSTGRES_PASSWORD: ${VIDEO_NODE_DB_PASSWORD:-video_node}
      POSTGRES_DB: ${VIDEO_NODE_DB_NAME:-video_node}
    volumes:
      - node-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDEO_NODE_DB_USER:-video_node} -d ${VIDEO_NODE_DB_NAME:-video_node}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: installs on the first run, applies migrations afterwards.
  bootstrap:
    build:
      context: .
      target: cli
    image: uiliuili-cli:local
    restart: "no"
    command: ["node", "dist/index.js", "bootstrap"]
    environment:
      <<: *app-environment
      SITE_NAME: ${SITE_NAME:-萌悠}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-一个自托管的弹幕视频站}
      SITE_LOCALE: ${SITE_LOCALE:-zh-CN}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Asia/Shanghai}
      SITE_REGISTRATION: ${SITE_REGISTRATION:-open}
      INSTALL_LOCALE: ${INSTALL_LOCALE:-zh-CN}
      INSTALL_DEMO_CONTENT: ${INSTALL_DEMO_CONTENT:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PREFIX: ${S3_PREFIX:-uiliuili}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-uiliuili}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_VERIFICATION_REQUIRED: ${MAIL_VERIFICATION_REQUIRED:-false}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-}
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-}
      MEILISEARCH_INDEX_PREFIX: ${MEILISEARCH_INDEX_PREFIX:-uiliuili}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    image: uiliuili-api:local
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  worker:
    build:
      context: .
      target: worker
    image: uiliuili-worker:local
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 60s

  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:3001
    image: uiliuili-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    build:
      context: .
      target: gateway
    image: uiliuili-gateway:local
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # External video node (own DB, own storage, FFmpeg transcoding and panel).
  # Enable with: docker compose --profile video-node up -d
  video-node:
    build:
      context: .
      target: video-node
    image: uiliuili-video-node:local
    profiles: ["video-node"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VIDEO_NODE_PORT: 3100
      VIDEO_NODE_HOST: 0.0.0.0
      VIDEO_NODE_ID: ${VIDEO_NODE_ID:-video-node-1}
      VIDEO_NODE_NAME: ${VIDEO_NODE_NAME:-视频节点 1}
      VIDEO_NODE_PUBLIC_URL: ${VIDEO_NODE_PUBLIC_URL:-http://localhost:3100}
      VIDEO_NODE_REGION: ${VIDEO_NODE_REGION:-}
      VIDEO_NODE_REGIONS: ${VIDEO_NODE_REGIONS:-}
      VIDEO_NODE_DATABASE_URL: postgres://${VIDEO_NODE_DB_USER:-video_node}:${VIDEO_NODE_DB_PASSWORD:-video_node}@node-postgres:5432/${VIDEO_NODE_DB_NAME:-video_node}
      VIDEO_NODE_SECRET: ${VIDEO_NODE_SECRET:-}
      VIDEO_NODE_KEY_ID: ${VIDEO_NODE_KEY_ID:-default}
      VIDEO_NODE_STORAGE_ROOT: /data/storage/video-node
      VIDEO_NODE_STORAGE_CAPACITY_BYTES: ${VIDEO_NODE_STORAGE_CAPACITY_BYTES:-0}
      VIDEO_NODE_TRANSCODE_CONCURRENCY: ${VIDEO_NODE_TRANSCODE_CONCURRENCY:-2}
      VIDEO_NODE_MAX_HEIGHT: ${VIDEO_NODE_MAX_HEIGHT:-1080}
      VIDEO_NODE_MAX_UPLOAD_BYTES: ${VIDEO_NODE_MAX_UPLOAD_BYTES:-8589934592}
      VIDEO_NODE_PANEL_PASSWORD: ${VIDEO_NODE_PANEL_PASSWORD:-}
      VIDEO_NODE_PANEL_SECRET: ${VIDEO_NODE_PANEL_SECRET:-}
      VIDEO_NODE_REPLICA_ALLOWED_HOSTS: ${VIDEO_NODE_REPLICA_ALLOWED_HOSTS:-}
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${VIDEO_NODE_HOST_PORT:-3100}:3100"
    volumes:
      - node-data:/data
    depends_on:
      node-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

volumes:
  db-data:
  redis-data:
  app-data:
  node-db-data:
  node-data:
